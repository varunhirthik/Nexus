version: '3.8'

services:
  # Backend - Pathway Pipeline
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: news-analyst-backend
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PATHWAY_HOST=0.0.0.0
      - PATHWAY_PORT=8000
      - RSS_POLL_INTERVAL=${RSS_POLL_INTERVAL:-60}
      - AUTOCOMMIT_DURATION_MS=${AUTOCOMMIT_DURATION_MS:-1000}
    volumes:
      - ../data:/app/data
      - ../backend/src:/app/src
    restart: unless-stopped
    networks:
      - news-analyst-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend - React + Vite
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: news-analyst-frontend
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - news-analyst-network
    restart: unless-stopped

networks:
  news-analyst-network:
    driver: bridge

volumes:
  data:
